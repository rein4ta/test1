<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOTOBOX — Foto Berdua!</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1b3d;--pink:#ff4f8b;--yellow:#ffd23f;--teal:#2ec4b6;--cream:#fff3d6;--purple:#7b5cff;--orange:#ff8a3d}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;font-weight:900;color:var(--ink);background:var(--teal);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:repeating-conic-gradient(from 0deg at 50% 40%,#2ec4b6 0 8deg,#27b0a3 8deg 16deg)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(43,27,61,.18) 20%,transparent 21%) 0 0/16px 16px;opacity:.5}
.st{position:fixed;font-size:44px;z-index:-1;cursor:pointer;user-select:none;animation:fl 5s ease-in-out infinite;transition:transform .25s;filter:drop-shadow(3px 3px 0 var(--ink))}
.st:hover{transform:scale(1.4) rotate(20deg)}.st.pop{animation:pop .5s}
@keyframes fl{50%{translate:0 -16px;rotate:10deg}}
@keyframes pop{40%{transform:scale(1.8) rotate(-30deg)}}
main{max-width:1000px;margin:0 auto;padding:16px}
.awning{height:34px;border:4px solid var(--ink);border-bottom:0;border-radius:18px 18px 0 0;background:repeating-linear-gradient(90deg,var(--pink) 0 40px,var(--cream) 40px 80px)}
.frame{background:var(--cream);border:4px solid var(--ink);border-radius:0 0 22px 22px;box-shadow:8px 8px 0 var(--ink);padding:20px}
h1{font-family:Bungee,Impact,sans-serif;font-size:clamp(34px,8vw,64px);text-align:center;color:var(--cream);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--pink);transform:rotate(-2deg);animation:tilt 3s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(2deg) scale(1.03)}}
.sub{text-align:center;margin:6px 0 16px}
.screen{animation:in .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.95)}}
[hidden]{display:none!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.row,.lobby{grid-template-columns:1fr!important}}
.card{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:18px;box-shadow:5px 5px 0 var(--ink)}
.card h2{font-family:Bungee,Impact;font-size:20px;margin-bottom:10px}
input{width:100%;padding:12px;font:inherit;border:3px solid var(--ink);border-radius:12px;margin-bottom:10px;background:var(--cream);outline:0}
input:focus{box-shadow:0 0 0 4px var(--yellow)}
.btn{font:inherit;font-family:Bungee,Impact;cursor:pointer;border:3px solid var(--ink);border-radius:14px;padding:12px 16px;background:var(--yellow);color:var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}.btn.teal{background:var(--teal)}.btn.on{background:var(--purple);color:#fff}
.btn:disabled{opacity:.45;pointer-events:none}.w{width:100%}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.chip{background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-family:Bungee;letter-spacing:3px;cursor:pointer}
.lobby{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vid{position:relative;border:4px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--ink);aspect-ratio:4/3;box-shadow:4px 4px 0 var(--pink)}
.vid video,.vid canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.vid.r video{transform:none}
.tag{position:absolute;left:8px;bottom:8px;background:var(--cream);border:2px solid var(--ink);border-radius:8px;padding:2px 8px;font-size:12px;z-index:2}
.tag.ok{background:var(--teal)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.f{font:inherit;font-size:13px;cursor:pointer;padding:6px 12px;border:3px solid var(--ink);border-radius:999px;background:#fff;transition:transform .15s}
.f:hover{transform:scale(1.1) rotate(-3deg)}.f.a{background:var(--pink);color:#fff}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.chat{display:flex;flex-direction:column;height:100%;min-height:300px}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;max-height:340px}
.m{padding:6px 10px;border:2px solid var(--ink);border-radius:12px;max-width:85%;font-size:14px;word-break:break-word;animation:in .25s}
.m.me{align-self:flex-end;background:var(--yellow)}.m.th{background:#ffd1e3}
#count{position:fixed;inset:0;display:grid;place-items:center;background:rgba(43,27,61,.55);z-index:50;font-family:Bungee;font-size:min(40vw,240px);color:var(--cream);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:10px 10px 0 var(--pink)}
#count span{animation:cd 1s ease-out}@keyframes cd{from{transform:scale(2.2);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
#flash.go{animation:fh .4s}@keyframes fh{from{opacity:1}}
#toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:70;transition:.3s;opacity:0;pointer-events:none}
#toast.s{opacity:1}
#strip{max-width:min(100%,420px);display:block;margin:0 auto 14px;border:4px solid var(--ink);border-radius:8px;box-shadow:6px 6px 0 var(--ink)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="st" style="top:8%;left:4%">⭐</div><div class="st" style="top:20%;right:5%;animation-delay:-1s">💖</div>
<div class="st" style="bottom:12%;left:6%;animation-delay:-2s">📸</div><div class="st" style="bottom:8%;right:7%;animation-delay:-3s">✨</div>
<div class="st" style="top:55%;left:1%;animation-delay:-4s">🎞️</div>
<main>
  <div class="awning"></div>
  <div class="frame">
    <h1>PHOTOBOX</h1>
    <p class="sub">Foto berdua dari mana saja — buat lobby, kirim kode, klik! 📸</p>

    <section id="home" class="screen row">
      <div class="card"><h2>🎀 Buat Lobby</h2>
        <input id="lobbyName" placeholder="Nama lobby (mis. Bestie Squad)" maxlength="24">
        <button class="btn pink w" id="btnCreate">Buat &amp; Generate Kode</button></div>
      <div class="card"><h2>🔑 Gabung Lobby</h2>
        <input id="joinCode" placeholder="Masukkan kode" maxlength="6" style="text-transform:uppercase;letter-spacing:4px">
        <button class="btn teal w" id="btnJoin">Masuk Lobby</button></div>
    </section>

    <section id="lobby" class="screen" hidden>
      <div class="bar"><h2 id="lobbyTitle" style="font-family:Bungee"></h2>
        <div><span class="chip" id="codeChip" title="Klik untuk salin"></span> <span id="status"></span></div></div>
      <div class="lobby">
        <div>
          <div class="vids">
            <div class="vid"><video id="vMe" autoplay muted playsinline></video><canvas id="game" width="320" height="240"></canvas><span class="tag" id="tagMe">Kamu</span></div>
            <div class="vid r"><video id="vFr" autoplay playsinline></video><span class="tag" id="tagFr">Menunggu teman…</span></div>
          </div>
          <p style="margin-top:8px">🎮 Mini game: gerakkan tangan di depan kamera untuk memecahkan balon! Skor: <b id="sMe">0</b> · Teman: <b id="sFr">0</b></p>
          <div class="filters" id="filters"></div>
          <div class="acts">
            <button class="btn" id="btnMic">🎤 Mic ON</button>
            <button class="btn pink" id="btnReady" disabled>✅ Aku Siap!</button>
          </div>
        </div>
        <div class="card chat"><h2>💬 Chat</h2><div id="msgs"></div>
          <input id="chatIn" placeholder="Ketik pesan…" maxlength="200" style="margin:0"></div>
      </div>
    </section>

    <section id="result" class="screen" hidden>
      <canvas id="strip"></canvas>
      <div class="acts" style="justify-content:center">
        <button class="btn pink" id="btnDl">⬇️ Unduh</button>
        <button class="btn" data-th="0">Candy</button><button class="btn" data-th="1">Sunset</button><button class="btn" data-th="2">Mint</button>
        <button class="btn teal" id="btnAgain">🔁 Foto Lagi</button>
      </div>
    </section>
  </div>
</main>
<div id="count" hidden><span></span></div><div id="flash"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
